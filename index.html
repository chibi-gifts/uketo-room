<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>かんたん受け取り</title>
<script>
  if (new URLSearchParams(window.location.search).get("gift")) {
    document.documentElement.classList.add("gift-loading");
  }
</script>
 <style>
  
   html.gift-loading .container {
    visibility: hidden;
  }
  
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;

    font-family:
      -apple-system,
      BlinkMacSystemFont,
      "Hiragino Kaku Gothic ProN",
      "Yu Gothic",
      sans-serif;

    background: linear-gradient(
      180deg,
      #fff4fa 0%,
      #fffaf3 100%
    );

    color: #6b5b63;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
  }

  .container {
    width: 100%;
    max-width: 390px;
    text-align: center;
  }
   .container {
  position: relative;
  z-index: 1;
}

#screenBackground {
  z-index: 0;
}
.screen-background {
  position: fixed;
  top: -50px;
  left: 0;
  width: 100%;
  height: auto;
  z-index: -1;
}
  h1 {
    margin: 0 0 20px;

    font-size: 27px;
    font-weight: 700;

    color: #e889ad;
    letter-spacing: 0.03em;
  }

  .description {
    margin: 0 auto 30px;

    font-size: 16px;
    line-height: 1.8;
    font-weight: 500;
  }

  .description strong {
    color: #e889ad;
  }

  .step-title {
    margin-bottom: 10px;

    font-size: 16px;
    font-weight: 700;

    color: #d879a1;
  }

  .input-area {
    width: 100%;
    height: 68px;

    border: 2px solid #f1bfd2;
    border-radius: 18px;

    background: #ffffff;

    padding: 0 18px;

    font-size: 16px;
    color: #665b60;

    outline: none;

    box-shadow:
      0 4px 12px rgba(220, 150, 180, 0.12);

    transition: 0.2s;
  }

  .input-area:focus {
    border-color: #e99bb9;

    box-shadow:
      0 0 0 4px rgba(233, 155, 185, 0.15);
  }

  .input-area::placeholder {
    color: #c8bfc3;
  }

  .paste-help {
    margin: 10px 0 28px;

    font-size: 13px;
    color: #9b8e94;
  }

  .receive-button {
    width: 100%;
    height: 68px;

    border: none;
    border-radius: 22px;

    background: #e8e1e4;
    color: #b7afb3;

    font-size: 20px;
    font-weight: 700;

    box-shadow: none;

    cursor: not-allowed;

    transition:
      transform 0.15s,
      background 0.2s,
      box-shadow 0.2s;
  }

  .receive-button.active {
    background: linear-gradient(
      135deg,
      #f29fc0,
      #e98bae
    );

    color: #ffffff;

    box-shadow:
      0 6px 14px rgba(220, 145, 175, 0.2);

    cursor: pointer;
  }

  .receive-button.active:active {
    transform: scale(0.97);
  }

  .bottom-message {
    margin-top: 22px;

    font-size: 14px;
    line-height: 1.7;

    color: #9b8e94;
  }

  .heart {
    color: #e98bae;
  }

  .result-message {
    display: none;

    margin-top: 310px;

    padding: 15px;

    border-radius: 16px;

    background: #ffffff;

    color: #d879a1;

    font-size: 15px;
    font-weight: 600;

    box-shadow:
      0 4px 12px rgba(220, 150, 180, 0.12);
  }
.copy-button {
  width: 100%;
  height: 56px;

  margin-top: 12px;

  border: none;
  border-radius: 18px;

  background: linear-gradient(
    135deg,
    #f29fc0,
    #e98bae
  );

  color: #ffffff;

  font-size: 17px;
  font-weight: 700;

  box-shadow:
    0 5px 12px rgba(220, 145, 175, 0.18);

  cursor: pointer;

  transition:
    transform 0.15s,
    box-shadow 0.2s;
}

.copy-button:active {
  transform: scale(0.97);
}
  @media (min-width: 600px) {
    body {
      padding: 40px;
    }

    .container {
      max-width: 420px;
    }
  }
/* 背景画像に合わせて元の固定デザインを隠す */
#linkPart {
  position: fixed;
  top: 78vw;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 90px);
  height: 70px;  
  max-width: 390px;
  z-index: 10;
}
   #recipientName {
  position: fixed;
  top: 382px;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 100px);
  height: 50px;  
  max-width: 390px;
  z-index: 10;
}
   #receiveButton {
  position: fixed;
  top: 438px;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 90px);
  height: 66px;  
  max-width: 390px;
  z-index: 10;
}
   #pageTitle,
#description,
#stepTitle,
.paste-help,
#recipientStepTitle,
.bottom-message {
  visibility: hidden;
}
body.gift-page #description {
  visibility: visible !important;
  position: fixed;
  top: 111vw;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
}
/* 受取画面のPayPayボタン位置 */
body.gift-page #receiveButton {
  top: 120vw;
  width: calc(100% - 85px);
  height: 65px;
}
 </style>
</head>

<body>
<div id="screenBackground"></div>
<div class="container">

<h1 id="pageTitle">🎁 PayPayを送る</h1>

<p class="description" id="description">
  PayPayリンクを貼ってね♡
</p>

<div class="step-title" id="stepTitle">
  👇 PayPayリンクを貼り付け 👇
</div>

<input
  type="text"
  id="linkPart"
  class="input-area"
placeholder="PayPayリンクを貼り付け"
  autocomplete="off"
  autocorrect="off"
  autocapitalize="off"
  spellcheck="false"
>

<div class="paste-help">
  PayPayの送るリンクをそのまま貼り付けてね♡
</div>
<div class="step-title" id="recipientStepTitle">
  💕 受け取る人のお名前♡
</div>

<input
  type="text"
  id="recipientName"
  class="input-area"
  placeholder="お名前を入力してね"
  autocomplete="off"
>
<button
  id="receiveButton"
  class="receive-button"
  disabled
>
  💗 受け取りページを作る
</button>

<div
  id="resultMessage"
  class="result-message"
>

<button
  id="copyButton"
  class="copy-button"
  style="display: none;"
>
  💗 リンクをコピー
</button>
</div>

<div class="bottom-message" id="bottomMessage">
  これだけでOKです😊<br>
  <span class="heart">♡</span>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getAuth,
  signInAnonymously
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
  getDatabase,
  ref,
  set,
  get,
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


const firebaseConfig = {
  apiKey: "AIzaSyDbU8RmK0JwrmS7DqV7XVvHSCCmu7OLihc",
  authDomain: "uketo-room.firebaseapp.com",
  databaseURL: "https://uketo-room-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "uketo-room",
  storageBucket: "uketo-room.firebasestorage.app",
  messagingSenderId: "109861986967",
  appId: "1:109861986967:web:57fff118fcb4dcdb67bfd2"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getDatabase(app);


const input =
  document.getElementById("linkPart");
const recipientName =
  document.getElementById("recipientName");
const button =
  document.getElementById("receiveButton");

const resultMessage =
  document.getElementById("resultMessage");
const copyButton =
  document.getElementById("copyButton");
const pageTitle =
  document.getElementById("pageTitle");

const description =
  document.getElementById("description");

const stepTitle =
  document.getElementById("stepTitle");

const pasteHelp =
  document.querySelector(".paste-help");

const bottomMessage =
  document.getElementById("bottomMessage");


/* =========================
   URLから受け取りIDを取得
   ========================= */

const params =
  new URLSearchParams(window.location.search);

const giftId =
  params.get("gift");


/* =========================
   Firebase匿名ログイン
   ========================= */

signInAnonymously(auth)
  .then(() => {
    console.log("匿名ログイン成功");
  })
  .catch((error) => {
    console.error("匿名ログイン失敗", error);
  });


/* =========================
   受け取りページ
   ========================= */

if (giftId) {


recipientName.style.display =
  "none";
  document.getElementById("recipientStepTitle").style.display =
  "none";


  description.textContent =
    "あなたへのPayPayです♡";

  input.style.display =
    "none";

  if (stepTitle) {
    stepTitle.style.display =
      "none";
  }

  if (pasteHelp) {
    pasteHelp.style.display =
      "none";
  }

  if (bottomMessage) {
    bottomMessage.style.display =
      "none";
  }

  button.textContent =
    "💗 PayPayで受け取る";





  try {

    const linkRef =
      ref(db, "links/" + giftId);

    const snapshot =
      await get(linkRef);


    if (!snapshot.exists()) {

      resultMessage.textContent =
        "この受け取りページは存在しません💦";

      button.style.display =
        "none";

    } else if (snapshot.val().status !== "active") {

      resultMessage.textContent =
        "🎁 受け取り済みです♡";

      button.style.display =
        "none";

} else {

  const data =
    snapshot.val();

  if (data.name) {
    description.textContent =
      data.name + "さんへのPayPayです♡";
  }
document.documentElement.classList.remove("gift-loading");
document.body.classList.add("gift-page");
  button.disabled =
    false;

  button.classList.add("active");

}

  } catch (error) {

    console.error(error);

    resultMessage.textContent =
      "ページを確認できませんでした💦";

    button.style.display =
      "none";

  }

}


/* =========================
   通常ページ
   ========================= */

if (!giftId) {

  pageTitle.textContent =
    "🎁 PayPayを送る";

  description.textContent =
    "PayPayリンクを貼ってね♡";


  if (stepTitle) {

    stepTitle.textContent =
      "👇 PayPayリンクを貼り付け 👇";

  }


  if (pasteHelp) {

    pasteHelp.textContent =
      "PayPayの送るリンクをそのまま貼り付けてね♡";

  }


  input.addEventListener(
    "input",
    function() {

      const value =
        input.value.trim();

      resultMessage.style.display =
        "none";


    if (
  value.length > 0 &&
  recipientName.value.trim().length > 0
) {

        button.disabled =
          false;

        button.classList.add("active");

      } else {

        button.disabled =
          true;

        button.classList.remove("active");

      }

    }
  );
recipientName.addEventListener(
  "input",
  function() {

    const value =
      input.value.trim();

    const name =
      recipientName.value.trim();

    if (
      value.length > 0 &&
      name.length > 0
    ) {

      button.disabled =
        false;

      button.classList.add("active");

    } else {

      button.disabled =
        true;

      button.classList.remove("active");

    }

  }
);
}


/* =========================
   ボタンを押したとき
   ========================= */

button.addEventListener(
  "click",
  async function() {


    /* =========================
       受け取りページの場合
       ========================= */

    if (giftId) {

      try {

        const linkRef =
          ref(db, "links/" + giftId);

        const snapshot =
          await get(linkRef);


        if (!snapshot.exists()) {

          resultMessage.textContent =
            "この受け取りページは存在しません💦";

          button.style.display =
            "none";

          return;

        }


        const data =
          snapshot.val();
if (data.name) {
  description.textContent =
    data.name + "さんへのPayPayです♡";
}

        if (data.status !== "active") {

          resultMessage.textContent =
            "🎁 受け取り済みです♡";

          button.style.display =
            "none";

          return;

        }


/* =========================
   PayPayリンクを開く
   ========================= */

window.location.href =
  data.url;

return;


      } catch (error) {

        console.error(error);

        resultMessage.textContent =
          "PayPayを開けませんでした💦";

        return;

      }

    }


    /* =========================
       受け取りページを作る
       ========================= */

   const value =
  input.value.trim();

const name =
  recipientName.value.trim();


if (!value || !name) {
  return;
}


    const baseUrl =
      "https://pay.paypay.ne.jp/";


    const linkPart =
      value.startsWith(baseUrl)
        ? value.slice(baseUrl.length)
        : value;


    const paypayUrl =
      baseUrl + linkPart;


    try {

      const newGiftId =
        crypto.randomUUID()
          .replaceAll("-", "");


      const linkRef =
        ref(db, "links/" + newGiftId);


      await set(linkRef, {

  url: paypayUrl,

  name: recipientName.value.trim(),

  status: "active",

  createdAt: Date.now()

});


      const giftUrl =
        window.location.origin +
        window.location.pathname +
        "?gift=" +
        newGiftId;


resultMessage.firstChild.nodeValue =
  "🎁 受け取りページができました♡\n\n" +
  giftUrl;

resultMessage.style.display =
  "block";

copyButton.style.display =
  "block";

copyButton.onclick =
  async function() {

    try {

      await navigator.clipboard.writeText(giftUrl);

      copyButton.textContent =
        "💗 コピーしました♡";

    } catch (error) {

      console.error(error);

      copyButton.textContent =
        "コピーできませんでした💦";

    }

  };

    } catch (error) {

      console.error(error);

      resultMessage.textContent =
        "ページ作成に失敗しました💦";

      resultMessage.style.display =
        "block";

    }

  }
);
const screenBackground =
  document.getElementById("screenBackground");

const backgroundImage =
  document.createElement("img");

backgroundImage.className =
  "screen-background";

backgroundImage.src =
  giftId
    ? "uketo_right_screen.png"
    : "uketo_left_screen.png";

screenBackground.appendChild(
  backgroundImage
);

</script>

</body>
</html>
